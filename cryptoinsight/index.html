<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Crypto Insight - AI Crypto</title>
    <meta name="description" content="Get Crypto Insight for iPhone, iPad or Android. Live crypto charts and AI market analysis in one app.">
    <meta name="apple-itunes-app" content="app-id=6753616682">
    <link rel="canonical" href="https://won-space.com/cryptoinsight/">
    <link rel="icon" href="/cryptoinsight/icon.png" type="image/png">
    <meta property="og:title" content="Crypto Insight - AI Crypto">
    <meta property="og:description" content="Live crypto charts and AI market analysis. Available on the App Store and Google Play.">
    <meta property="og:image" content="https://won-space.com/cryptoinsight/icon.png">
    <meta property="og:url" content="https://won-space.com/cryptoinsight/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <style>
        :root {
            color-scheme: dark;
            --background: #071315;
            --surface: #102125;
            --text: #f1f8f7;
            --muted: #b1c6c6;
            --accent: #72ecd1;
            --border: #30494c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 440px);
            text-align: center;
        }

        .app-icon {
            width: 104px;
            height: 104px;
            border-radius: 24px;
        }

        .eyebrow {
            margin: 24px 0 10px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 42px);
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        .description {
            margin: 16px auto 28px;
            max-width: 35ch;
            color: var(--muted);
            line-height: 1.65;
        }

        .stores {
            display: grid;
            gap: 12px;
        }

        .store {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
            padding: 16px 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            color: var(--text);
            text-align: left;
            text-decoration: none;
        }

        .store:hover { border-color: var(--accent); }
        .store:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
        .store strong { display: block; font-size: 20px; }
        .store small { display: block; margin-bottom: 4px; color: var(--muted); }
        .arrow { color: var(--accent); font-size: 24px; }

        .hint, .pricing {
            margin: 22px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .pricing { margin-top: 10px; }
    </style>
</head>
<body>
    <main>
        <img class="app-icon" src="/cryptoinsight/icon.png" alt="Crypto Insight" width="104" height="104">
        <p class="eyebrow">AI CRYPTO ANALYSIS</p>
        <h1>Crypto Insight</h1>
        <p class="description" data-copy="description">Live crypto charts and AI market analysis in one app.</p>
        <nav class="stores" aria-label="Download Crypto Insight">
            <a class="store" data-store="ios" href="https://apps.apple.com/app/id6753616682">
                <span><small>iPhone / iPad</small><strong>App Store</strong></span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>
            <a class="store" data-store="android" href="https://play.google.com/store/apps/details?id=com.aly.CryptoInsight">
                <span><small>Android</small><strong>Google Play</strong></span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>
        </nav>
        <p class="hint" data-copy="hint">On your computer? Choose a store above or open this link on your phone.</p>
        <p class="pricing" data-copy="pricing">Free charts. AI analysis requires a subscription.</p>
    </main>
    <script>
        (() => {
            const translations = {
                en: {
                    description: "Live crypto charts and AI market analysis in one app.",
                    hint: "On your computer? Choose a store above or open this link on your phone.",
                    opening: "Opening your app store. If it does not open, tap a store above.",
                    pricing: "Free charts. AI analysis requires a subscription."
                },
                ko: {
                    description: "실시간 코인 차트와 AI 시장 분석을 한곳에서 확인하세요.",
                    hint: "PC에서는 위 스토어를 선택하거나 휴대폰에서 이 링크를 열어 주세요.",
                    opening: "스토어로 이동합니다. 열리지 않으면 위 스토어 버튼을 눌러 주세요.",
                    pricing: "차트는 무료이며, AI 분석은 구독이 필요합니다."
                },
                ja: {
                    description: "暗号資産のリアルタイムチャートとAI市場分析を、ひとつのアプリで。",
                    hint: "パソコンでは上のストアを選ぶか、スマートフォンでこのリンクを開いてください。",
                    opening: "ストアを開いています。開かない場合は、上のストアボタンをタップしてください。",
                    pricing: "チャートは無料。AI分析にはサブスクリプションが必要です。"
                },
                zh: {
                    description: "在一个应用中查看实时加密货币图表和AI市场分析。",
                    hint: "在电脑上，请选择上方商店，或用手机打开此链接。",
                    opening: "正在打开应用商店。如未打开，请点击上方商店按钮。",
                    pricing: "图表免费。AI分析需要订阅。"
                }
            };
            const preferredLanguage = (navigator.language || "en").split("-")[0].toLowerCase();
            const language = translations[preferredLanguage] ? preferredLanguage : "en";
            const copy = translations[language];
            document.documentElement.lang = language;
            document.querySelectorAll("[data-copy]").forEach(element => {
                element.textContent = copy[element.dataset.copy];
            });

            const ua = navigator.userAgent || "";
            const isIpadDesktop = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
            const isIos = /iPhone|iPad|iPod/i.test(ua) || isIpadDesktop;
            const isAndroid = /Android/i.test(ua);
            const isCrawler = /bot|crawler|spider|preview/i.test(ua);
            const isWindowsPhone = /Windows Phone/i.test(ua);
            const store = isAndroid ? "android" : isIos ? "ios" : null;

            if (store && !isCrawler && !isWindowsPhone) {
                document.querySelector('[data-copy="hint"]').textContent = copy.opening;
                window.location.replace(document.querySelector(`[data-store="${store}"]`).href);
            }
        })();
    </script>
</body>
</html>
